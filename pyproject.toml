[project]
name = "unmscope"
version = "0.1.0"
description = "Python control software for the UNM light-sheet microscope (LouisXIV replacement)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "numpy",
    "tifffile",
    "PySide6",
    "pymmcore-plus",
    "qtpy",
    "nifpga",
    "pyserial",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pillow",  # tools/compare_to_labview.py (screen capture + pixel measurement)
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# test the checkout the tests live in (a worktree / branch), not the editable install
pythonpath = ["src"]
