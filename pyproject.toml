[project]
name = "unmscope"
version = "0.1.0"
description = "Python control software for the UNM light-sheet microscope (LouisXIV replacement)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "numpy",
    "PySide6",
    "pymmcore-plus",
    "nifpga",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
